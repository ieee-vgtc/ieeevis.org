name: PR Build Check

on:
  # Runs on PR open, reopen, and every new push to the PR branch (including
  # PRs from forks). The build runs the broken link checker.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [vis2026]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
